<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ketra</title>
    <style>
      html,
      body {
        margin: 0;
        width: 800px;
        height: 600px;
        overflow: hidden;
        background: #f4f4f4;
      }
      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      main {
        display: grid;
        height: 100%;
        place-items: center;
        text-align: center;
        color: #111;
        font-family: "Segoe UI", sans-serif;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 28px;
        font-weight: 500;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0;
        color: #8a8a8a;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <iframe id="app" title="Ketra"></iframe>
    <script src="popup.js"></script>
  </body>
</html>
