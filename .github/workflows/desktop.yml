name: Desktop builds

on:
  workflow_dispatch:
  push:
    paths:
      - "desktop app/**"
      - ".github/workflows/desktop.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and build Windows installer
        working-directory: desktop app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm install
          npx electron-builder --win nsis --x64 --publish never
          dir dist
      - name: Upload Windows installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: desktop app/dist/Ketra-Setup.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm
      - name: Install and build Linux .deb installer
        working-directory: desktop app
        run: |
          npm install
          chmod +x scripts/linux-after-install.sh scripts/linux-after-remove.sh
          npx electron-builder --linux deb --x64 --publish never
          ls -la dist
      - name: Upload Linux installer to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0
          files: desktop app/dist/Ketra.deb
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS paused: prior arm64-only DMG did not run on Intel Macs, and Gatekeeper needs signing.
  # Re-enable with --mac dmg --x64 --arm64 (or universal) plus Apple notarization.
